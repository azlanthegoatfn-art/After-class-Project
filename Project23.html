<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>

    <script>
      var student = {
        name: 'Azlan',
        age: '14',
        Grade: '9',
        hobbies: 'Gaming and Studying',
        fav_sport: 'Football'
      };

      var color = ["white", "black", "red", "green", "blue"];

      document.write(
        "Student name is : " + student.name,
        "<br>Student favorite sport is : " + student.fav_sport
      );

      document.write("<br>Before Popping the colors are: " + color.join("^"));
      document.write("<br>My favorite color is : " + color[3]);

      color.pop();

      document.write("<br>After Popping the colors are : " + color.join("*"));
    </script>
  </body>
</html>
